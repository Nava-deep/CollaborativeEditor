{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="A shared writing space that stays with you, online or off." />
    <title>Relay — collaborative editor</title>
    <link rel="stylesheet" href="{% static 'relay/styles.css' %}" />
    <script src="{% static 'relay/vendor/react.production.min.js' %}"></script>
    <script src="{% static 'relay/vendor/react-dom.production.min.js' %}"></script>
    <script src="{% static 'relay/vendor/lucide.js' %}"></script>
    <script src="{% static 'relay/vendor/diff-match-patch.js' %}"></script>
    <script src="{% static 'relay/vendor/babel.min.js' %}"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      fetch("{% static 'relay/app.jsx' %}")
        .then((response) => {
          if (!response.ok) throw new Error("Relay could not load the editor.");
          return response.text();
        })
        .then((source) => {
          const compiled = Babel.transform(source, { presets: ["env", "react"] }).code;
          new Function("React", "ReactDOM", "lucide", "DiffMatchPatch", compiled)(
            React, ReactDOM, lucide, DiffMatchPatch,
          );
        })
        .catch((error) => {
          document.getElementById("root").textContent = error.message;
        });
    </script>
  </body>
</html>
